kind: pipeline
type: docker
name: default

steps:
  - name: nix build
    image: nixos/nix
    volumes:
      - name: result
        path: ./result/
    commands:
      - >
        nix \
          --extra-experimental-features nix-command \
          --extra-experimental-features flakes \
          build

  - name: netlify deploy
    image: lucap/drone-netlify
    volumes:
      - name: result
        path: ./result/
    settings:
      token:
        from_secret: netlify_token
      site_id:
        from_secret: netlify_site_id
      path: ./result/