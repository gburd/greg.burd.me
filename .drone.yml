kind: pipeline
type: docker
name: default

environment:
  NIX: nix --extra-experimental-features nix-command --extra-experimental-features flakes

steps:
  - name: nix build
    image: nixos/nix
    volumes:
      - name: site
        path: /site
    commands:
      - $NIX build
      - cp -r result/* /site/

  - name: netlify deploy
    image: lucap/drone-netlify
    volumes:
      - name: site
        path: /site
    settings:
      token:
        from_secret: netlify_token
      site_id:
        from_secret: netlify_site_id
      path: /site

volumes:
  - name: site
    temp: {}