kind: pipeline
type: docker
name: default

steps:
  - name: nix build
    image: nixos/nix
    volumes:
      - name: site
        path: /site/
    commands:
      - >
        nix \
          --extra-experimental-features nix-command \
          --extra-experimental-features flakes \
          build
      - cp -r result/* /site/

  - name: netlify deploy
    image: lucap/drone-netlify
    volumes:
      - name: site
        path: /site/
    settings:
      token:
        from_secret: netlify_token
      site_id:
        from_secret: netlify_site_id
      path: /site