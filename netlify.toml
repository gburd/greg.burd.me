# Netlify build configuration.
#
# Workflow:
#   - Push to `main`           -> production deploy at https://greg.burd.me
#   - Push to any other branch -> branch deploy at https://<branch>--burd-me.netlify.app
#   - Open a PR                -> deploy preview at https://deploy-preview-<n>--burd-me.netlify.app
#
# Drafts (`+++ draft = true`) are included in branch deploys and previews,
# excluded from production.

[build]
  publish = "public/"
  # `zola build` honors $BASE_URL when set; we pass --base-url explicitly per
  # context below so production gets the canonical URL and previews get their
  # own deploy URL.
  command = "zola build --base-url $URL"

[build.environment]
  # Pin the Zola toolchain so deploys are reproducible. Bump deliberately.
  ZOLA_VERSION = "0.20.0"

# Production: only `main`, no drafts, canonical URL.
[context.production]
  command = "zola build --base-url $URL"

[context.production.environment]
  URL = "https://greg.burd.me"

# Deploy previews (PRs against `main`): include drafts, use the preview URL.
[context.deploy-preview]
  command = "zola build --drafts --base-url $DEPLOY_PRIME_URL"

# Branch deploys (any non-`main` branch, e.g. `staging`): include drafts.
[context.branch-deploy]
  command = "zola build --drafts --base-url $DEPLOY_PRIME_URL"

[dev]
  command = "zola serve --drafts"
  publish = "public/"
  port = 1111

# Redirect the bare Netlify URL to the canonical domain.
[[redirects]]
  from = "https://burd-me.netlify.app/*"
  to = "https://greg.burd.me/:splat"
  force = true

# Avoid http -> https -> www double redirect on the apex.
[[redirects]]
  from = "http://burd.me"
  to = "https://greg.burd.me/:splat"
  force = true

# Default headers applied to every response.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Permissions-Policy = "interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = '''
    default-src 'none';
    img-src 'self' https://stats.burd.me;
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    script-src 'self' https://stats.burd.me;
    form-action 'none';
    frame-ancestors 'none';
    base-uri 'none';
    upgrade-insecure-requests;
    sandbox
      allow-same-origin
      allow-scripts
      allow-popups
      allow-popups-to-escape-sandbox
    '''

# Per-asset caching.
[[headers]]
  for = "/font/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/style/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
